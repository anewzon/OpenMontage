name: relaxation
version: "2.0"
description: >
  Cinematic relaxation pipeline for any approved duration from 60 seconds to
  5 hours. Suits rivers, forests, waterfalls, ocean, rain, fireplace, night
  nature, meditation and sleep scenery, and comparable calm formats.
  Channel-specific identity - subject priorities, look, audio balance,
  opening and delivery canvas - lives in that channel's BRAND.md, never in
  this pipeline. Research is web-grounded like the explainer pipeline.
  Procurement supports two sourcing modes chosen per project from
  proposal_packet.metadata.sourcing: licensed_manual, where a person buys and
  downloads the footage, and free_auto, where permitted free stock is acquired
  through OpenMontage's own provider tools. Both keep a human approval gate.
  Everything after that inverts the documentary-montage order: media is
  analysed FIRST and the edit is cast from what the footage actually contains
  rather than from search queries. Camera movement is measured and recorded
  separately from subject movement. Renders through FFmpeg; long productions
  use chunked, stream-copy assembly so a late failure resumes rather than
  restarting, and chunk boundaries never overwrite an approved transition.
  Generated audio - music through suno_music and SFX through elevenlabs_sfx -
  is produced in the assets stage from the approved concept and the real
  footage, and only inside a paid budget the operator approved at proposal:
  every paid call is estimated, reserved, executed and reconciled through
  OpenMontage's CostTracker in cap mode, and stops at the cap.
category: custom
stability: beta
default_checkpoint_policy: guided

reference_input:
  supported: true

# Duration contract. The pipeline is duration-agnostic between these bounds;
# a channel or a brief narrows it, this manifest does not. Editorial scale
# (movements, shot count, holds, music, ambience, sourcing, QC sampling,
# chunking) follows the approved duration rather than a fixed template.
metadata:
  duration:
    min_seconds: 60
    max_seconds: 18000          # 5 hours
    note: >
      Validated at the proposal stage. A request outside the range is
      surfaced, never silently shortened or stretched.
  chunking:
    threshold_seconds: 1200     # 20 minutes
    note: >
      At or below the threshold, chunking is optional and used only when
      render complexity requires it. Above it, metadata.chunk_plan[] is
      required so a late failure resumes instead of restarting. For
      multi-hour work, chunks of roughly 10-20 minutes are practical, but
      that interval is a rendering convenience and never an editorial rule -
      every boundary must still fall on a transition-safe position.

orchestration:
  mode: executive-producer
  skill: pipelines/relaxation/executive-producer
  # No paid spend without an operator-approved budget. The approved figure is
  # proposal_packet.approval.approved_budget_usd, enforced by CostTracker in
  # cap mode via lib.relaxation_policy.approved_budget_tracker().
  budget_default_usd: 0.00
  max_revisions_per_stage: 3
  max_send_backs: 2
  # Advisory budget the Executive Producer reads; nothing in the codebase
  # enforces it as a wall clock, and native checkpoints make a production
  # resumable across sessions. Raised so it cannot read as a reason to refuse
  # or truncate a legitimate 5-hour production: 5 hours of delivered runtime
  # plus analysis, mixing, encoding and QC does not fit in 600 minutes on
  # CPU encoding.
  max_wall_time_minutes: 2880

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/relaxation/executive-producer
  - pipelines/relaxation/research-director
  - pipelines/relaxation/proposal-director
  - pipelines/relaxation/procurement-director
  - pipelines/relaxation/asset-director
  - pipelines/relaxation/scene-director
  - pipelines/relaxation/edit-director
  - pipelines/relaxation/compose-director
  - pipelines/relaxation/publish-director
  - meta/asset-procurement
  - meta/audio-mastering
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  custom_allowed: true

stages:
  # 1 - web-grounded topic research against the channel's own competitor list
  - name: research
    skill: pipelines/relaxation/research-director
    produces:
      - research_brief
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - The channel's COMPETITORS.md and RESEARCH.md were both read at runtime
      - Landscape covers the listed competitors plus the wider niche
      - Findings cite real observed sources, never invented numbers
      - Views-per-hour used when comparing videos of different ages
      - Unavailable signals are reported as unavailable, not estimated
      - At least 3 genuinely different angles discovered
      - Angles are original concepts, not competitor videos restated
    success_criteria:
      - Schema-valid research_brief artifact
      - data_points carry sources
      - angles_discovered has at least 3 entries grounded in findings
      - Skipped only when the operator locked the topic, and said so explicitly

  # 2 - concept selection; render runtime and duration locked here
  - name: proposal
    skill: pipelines/relaxation/proposal-director
    required_artifacts_in:
      - research_brief
    produces:
      - proposal_packet
    tools_available:
      - video_compose
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - "Duration validated: 60 <= target_duration_seconds <= 18000"
      - A duration outside the range is surfaced, not silently clamped
      - The operator's requested duration is not shortened or stretched silently
      - Editorial scale suits the duration; no fixed structure forced onto it
      - "Channel opening requirement read from BRAND.md and recorded in metadata.opening"
      - Opening duration counted inside the approved total duration
      - Concept is original and specific, not a competitor video reproduced
      - Concept sits inside the channel's BRAND.md
      - Movement structure is invented for this concept, not a reused skeleton
      - Duration, visual progression, pacing and soundscape direction are concrete
      - Packaging hypothesis present but explicitly provisional
      - render_runtime presented with both alternatives and logged as a decision
      - Paid audio estimated BEFORE any paid call, with plan_paid_audio, from the tools' own estimate_cost
      - Music planned as a programme from the channel's policy, not minute-for-minute against the runtime
      - Generated SFX planned in source seconds from the episode's needs, not the final runtime
      - Retry and rejection allowance stated explicitly and included in the estimate
      - Manually licensed footage recorded as external cost, excluded from API spend
      - A paid provider that cannot be priced blocks the plan and names the setting to confirm
      - Operator approved the concept AND the maximum paid budget
    success_criteria:
      - Schema-valid proposal_packet artifact
      - cost_estimate produced by plan_paid_audio with every paid line priced
      - metadata.paid_audio_plan records the music and SFX arithmetic
      - approval.approved_budget_usd recorded whenever any paid line exists
      - production_plan.render_runtime set explicitly
      - "metadata.target_duration_seconds present and within [60, 18000]"
      - "metadata.opening present when the channel's BRAND.md requires an opening"
      - decision_log contains a render_runtime_selection entry naming all options
      - Operator approved the selected concept

  # 3 - HUMAN GATE: the footage is licensed stock a person must buy
  - name: procurement
    skill: pipelines/relaxation/procurement-director
    required_artifacts_in:
      - proposal_packet
    produces: []
    # free_auto acquires through these native provider tools. In
    # licensed_manual they stay unused: that mode produces a shopping list and
    # stops for a person to license and download. No paid stock is ever
    # downloaded automatically.
    tools_available:
      - direct_clip_search
      - pexels_video
      - pixabay_video
      - pixabay_music
    optional_tools:
      - direct_clip_search
      - pexels_video
      - pixabay_video
      - pixabay_music
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Sourcing mode read from proposal_packet.metadata.sourcing, not assumed
      - "licensed_manual: no automated paid-stock downloading"
      - Sourcing quantity scaled to the approved duration, not a fixed count
      - Requests derive from the approved concept, not a generic shopping list
      - Every request states media type, purpose, preferred spec and destination
      - "licensed_manual: item URLs verified, or precise search instructions instead; no fabricated URLs"
      - "free_auto: acquired via native stock tools only - no scraper, no access workaround"
      - "free_auto: every asset carries provider, source URL, creator and licence"
      - "free_auto: downloaded files inspected on real content, not on search metadata"
      - Quantity is enough for the target duration at a sane reuse factor
      - Search intent seeks the camera movement the channel's BRAND.md asks for
      - No clip accepted on a title containing drone/cinematic/aerial - frames inspected
      - Camera motion MEASURED on downloaded files, never inferred from metadata
      - Acquired pool's movement_profile reported so its character is visible at the gate
      - Season, weather and light checked against the approved concept before accepting
      - A pool that cannot fulfil the concept is reported as a shortfall, not passed on
      - Human gate preserved in BOTH modes
      - Checkpoint written with status awaiting_human, then the turn ENDS
    success_criteria:
      - Checkpoint status is awaiting_human with the request or acquired pool in metadata
      - "licensed_manual: work/ASSET_LIST.md exists and is human-readable; nothing auto-downloaded"
      - "free_auto: assets present in the project workspace with provenance recorded"
      - "free_auto: metadata.movement_profile present and derived from measured clips"

  # 4 - analyse what the human actually downloaded
  - name: assets
    skill: pipelines/relaxation/asset-director
    required_artifacts_in:
      - proposal_packet
    produces:
      - asset_manifest
    required_tools: []
    # suno_music and elevenlabs_sfx are paid. They run here - after the real
    # footage is analysed - and only through approved_budget_tracker().run_tool.
    optional_tools:
      - video_analyzer
      - frame_sampler
      - audio_enhance
      - suno_music
      - elevenlabs_sfx
    tools_available:
      - video_analyzer
      - frame_sampler
      - audio_enhance
      - suno_music
      - elevenlabs_sfx
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Runs only after the human confirmed assets were added
      - Every supplied file probed; native analysis tools used, not ad-hoc scripts
      - Usable sub-ranges identified per clip, not whole-file assumptions
      - Usable ranges come from inspection, not a constant trim applied to every file
      - "CAMERA motion measured per clip and recorded SEPARATELY from subject motion"
      - A fixed camera filming moving water is recorded as static, never as movement
      - Camera motion, direction, speed band and steadiness recorded per clip
      - An unanalysed clip is recorded as unknown, never defaulted to static
      - Shot scale, season, weather and light recorded from sampled frames
      - metadata.inventory_stats.movement_profile reports the pool's movement variety
      - A pool that cannot support the concept's promised movement is reported here
      - Season/light incoherence against the concept surfaced, not left to the edit
      - Visually repetitive near-duplicates ranked or rejected, not all admitted
      - "BRAND.md avoid-list honoured: people as subject, roads, buildings rejected"
      - Clips below the delivery canvas flagged, never silently upscaled
      - Unsuitable assets rejected with a reason rather than forced in
      - Licence evidence cross-referenced; unverified assets flagged
      - Reuse factor reported against the approved duration
      - "Every clip's native audio classified USE / USE_AFTER_TREATMENT / REJECT / NO_AUDIO"
      - Usable native audio has a MEASURED level, never a blanket percentage
      - Music screened on metadata and measured content; evidence recorded without overclaiming
      - "Paid generation only after proposal approval, via approved_budget_tracker().run_tool, never tool.execute directly"
      - Every paid call estimated, reserved, executed and reconciled in cost_log.json
      - Projected spend beyond the approved budget STOPS the run; it is never a warning
      - Retries are new paid calls and are charged against the same budget
      - A provider pricing mismatch halts further paid calls until the operator resolves it
      - Every candidate from a paid music generation evaluated; candidate zero not accepted blindly
      - SFX derived from BRAND.md, the actual footage and the approved concept - no fixed category list
      - Good native clip audio preferred over generating an equivalent SFX layer
      - Long environmental beds generated as short loopable sources, not minute-for-minute
      - No silent provider substitution; an unavailable provider is reported with registry alternatives
    success_criteria:
      - Schema-valid asset_manifest artifact
      - "Generated audio assets carry provider, model, prompt and cost_usd"
      - cost_log.json spend stays within approval.approved_budget_usd
      - "Every asset has id, type, path, source_tool, scene_id and duration_seconds"
      - "Per-asset analysis lives in metadata.asset_analysis[asset_id], not on the asset entry"
      - metadata.inventory_stats present including the reuse factor
      - Every accepted video asset carries a measured camera_motion value
      - Every accepted video asset carries a subject_motion value recorded separately
      - metadata.inventory_stats.movement_profile present

  # 5 - cast the concept onto the real footage
  - name: scene_plan
    skill: pipelines/relaxation/scene-director
    required_artifacts_in:
      - proposal_packet
      - asset_manifest
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every slot references a real asset id and a real usable sub-range
      - "Shot scale, camera motion and subject motion recorded per slot, separately"
      - Camera motion carried from the manifest's MEASURED values, not re-guessed
      - The sequence shows a coherent progression and a real sense of travel
      - Changes of perspective and scale are deliberate
      - Aerial, moving-camera and closer immersive footage all used purposefully
      - Season, weather and lighting are compatible across adjacent slots
      - Season and light are consistent with the approved concept
      - Shot durations chosen from actual visual interest, not a pattern
      - No long run of similar stationary close-ups, even with moving water
      - Strongest footage used to establish and advance the journey
      - No prewritten movement structure forced onto footage that cannot carry it
      - No asset reused twice inside one movement
      - Cross-movement reuse is deliberate, spaced and justified
      - Per-movement ambience and music intent stated
      - Slot holds vary genuinely; no mechanical rotation
      - Repetition screening performed BEFORE the render, with specific slots named
    success_criteria:
      - Schema-valid scene_plan artifact
      - "scenes[] carries only canonical fields; relaxation detail lives in metadata.relaxation_slots[]"
      - "Every metadata.relaxation_slots[] entry maps to a scenes[] id"
      - Every slot resolves to an asset id present in asset_manifest
      - Every slot's in/out range exists in that asset's usable ranges
      - Sum of slot holds within 10% of the approved duration
      - Shot count and hold lengths scale with the approved duration
      - Pre-render repetition and coherence screening recorded with numbers

  # 6 - timeline, sound design and grade
  - name: edit
    skill: pipelines/relaxation/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    produces:
      - edit_decisions
    required_tools:
      - audio_mixer
    optional_tools:
      - color_grade
      - video_stitch
      - audio_enhance
      - video_trimmer
    tools_available:
      - audio_mixer
      - color_grade
      - video_stitch
      - audio_enhance
      - video_trimmer
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - render_runtime carried unchanged from the approved proposal
      - Shot durations vary; no run of near-identical holds
      - Transition vocabulary at most 4 values, each choice motivated
      - Straight cuts carry most of the film; the dissolve is not the default
      - Dissolve durations follow the actual shots, not a single constant
      - metadata.transition_discipline recorded; its findings empty or answered
      - No dissolve between shots with opposing camera motion or a large exposure jump
      - Transition at_seconds are positions on the OVERLAP-CORRECTED timeline
      - Timeline duration accounts for crossfade overlap, not the raw sum of holds
      - "metadata.chunk_plan is a LIST of chunks with ids, start, end and cut ids"
      - No chunk boundary falls on or beside an approved dissolve
      - No two adjacent cuts share subject AND scale
      - Audio layers declared with per-layer volume, offset and fades
      - Per-layer gains DERIVED from MEASURED BUILT STEMS, never from source means
      - Per-layer gains never left at provider default
      - "Mix is MUSIC-LED: music is the reference layer"
      - Water supports the music and is not mixed as its peer
      - "Supporting ambience assessed as a COMBINED GROUP, not per layer"
      - Short-term extremes and transients inspected, not only integrated loudness
      - Balance verified on a short representative preview mix before the full render
      - J-cuts and L-cuts expressed as audio offsets, never video trims
      - Mixed soundscape normalised to 48 kHz stereo, loudness two-pass verified
      - Mix length DERIVED from the approved timeline, not a round number
      - Final fade lands inside the final duration
      - Rejected native audio contributes nothing; accepted native audio is range-aligned
      - Native environmental audio not doubled with an equivalent library or generated bed
      - Music programme reprises accepted tracks at phrase boundaries; no short-track loop, no repeated sequence
      - Generated SFX beds looped with crossfades and variation, never at one fixed interval
      - Music not ducked under ambience; no dialogue-mixing conventions applied
      - Long-form coverage counted honestly - overlapping files are not extra coverage
      - Grade is restrained normalisation, not styling
      - "metadata.chunk_plan[] present for any timeline over 20 minutes"
      - Short timelines are not chunked without a stated rendering reason
      - "Approved channel opening carried into metadata.opening and counted in the timeline"
      - Shot holds derive from duration, shot strength and role - not a fixed band
      - "metadata.audio_layers[] and metadata.mix_balance match the EXECUTED mix"
      - Every cut carries a reason that describes a decision
    success_criteria:
      - Schema-valid edit_decisions artifact
      - render_runtime set explicitly
      - Mixed audio file reports 48000 Hz and 2 channels via ffprobe
      - Measured integrated loudness within 1 LU of target
      - Timeline duration within 5% of the approved duration
      - Recorded timeline duration equals the overlap-corrected arithmetic
      - Recorded mix duration equals the mixed file's real duration
      - metadata.mix_balance records per-role built-stem loudness and applied gain
      - validate_chunk_plan returns no violations against the approved transitions

  # 7 - chunked render + technical and editorial QC
  - name: compose
    skill: pipelines/relaxation/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
      - proposal_packet
    produces:
      - render_report
    required_tools:
      - video_compose
    optional_tools:
      - video_stitch
      - audio_mixer
      - frame_sampler
      - visual_qa
    tools_available:
      - video_compose
      - video_stitch
      - audio_mixer
      - frame_sampler
      - visual_qa
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Routed by the locked render_runtime; no silent runtime swap
      - One chunk rendered and inspected before the long encode
      - Final assembly used stream copy, not a second lossy re-encode
      - Output is 3840x2160 (or the approved canvas) / 30 fps / yuv420p / H.264
      - Audio is AAC 48 kHz stereo at the approved loudness and true peak
      - "Delivered file has EXACTLY one audio stream - the approved mix, mapped 0:v + 1:a"
      - True peak measured with ebur128 on the ENCODED file, not sample peak on the WAV
      - Final fade verified present in the delivered file by measuring tail levels
      - Audio content reviewed - water coherence, layer balance, continuity
      - "Mix confirmed MUSIC-LED: water supportive, not overpowering"
      - Supporting ambience quiet and occasional; no abrupt layer changes
      - Loudness normalisation not used to repair an unbalanced mix
      - Checks that could not actually run are declared, never recorded as passes
      - Subjective listening never reported as a pass when no listening occurred
      - Duration matches the planned timeline within 2 seconds
      - "Rendered boundaries audited against the approved transition map"
      - No unintended hard cut where a dissolve was approved
      - No chunk boundary silently replaced an approved transition
      - Rendered boundary frames inspected for duplicate, black, frozen frames
      - Editorial pass - no mechanical repetition, no stock-playlist feeling
      - Camera-movement variety and aerial presence checked on the rendered file
      - No ASMR-loop dominance; season, light and environment coherent
      - Early creative screening used excerpts, not repeated full-film processing
      - "A BRAND-required opening was rendered, inspected and concatenated - never silently omitted"
      - A short Remotion opening is not a full-body runtime swap
      - Completed chunks preserved so a late failure resumes, never restarts
      - Audio-only corrections remuxed without re-encoding the video
    success_criteria:
      - Schema-valid render_report artifact
      - output/final.mp4 exists and passes ffprobe validation
      - "render_report.metadata.qc.technical records resolution, fps, pix_fmt, audio, loudness, sync"
      - "render_report.metadata.qc.transitions records the boundary audit and its method"
      - "render_report.metadata.qc.audio, .editorial and .brand present"
      - "QC lives under metadata.qc - the schema forbids a top-level qc key"
      - unexpected_cuts is empty for every audited boundary
      - A BRAND-required opening is present in the delivered file
      - Editorial findings recorded; any fail sends the run back to edit

  # 8 - export the ready-to-publish package (no upload)
  - name: publish
    skill: pipelines/relaxation/publish-director
    required_artifacts_in:
      - render_report
      - proposal_packet
    produces:
      - publish_log
    optional_tools:
      - frame_sampler
    tools_available:
      - frame_sampler
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Thumbnail candidates extracted from the finished video with frame_sampler
      - Runs only after final.mp4 exists and passed QC
      - Packaging describes the video actually made, not the plan
      - Title accurate, non-clickbait, not a competitor title reworded
      - Title formula differs from the channel's previous upload
      - Description ready to paste, no keyword stuffing
      - No competitor names or internal research in any published text
      - Tags a concise relevant set, not hundreds
      - Thumbnail a real frame from the video where possible; never a competitor clone
      - Exactly one final option delivered, not a menu
      - Nothing uploaded - export only
    success_criteria:
      - Schema-valid publish_log artifact recorded internally
      - "output/ holds exactly three operator files: final.mp4, thumbnail.jpg, publish.txt"
      - thumbnail.jpg is a valid readable JPEG
      - publish.txt follows the documented structure with no unreplaced placeholders
